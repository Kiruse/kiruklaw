[workspace]
resolver = "2"
members = [
  "agent-loop",
  "cli",
  "macros",
]

[workspace.dependencies]
anyhow = "1"
bytes = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sse-core = { version = "0.2", default-features = false, features = ["std", "stream"] }
thiserror = "2"
