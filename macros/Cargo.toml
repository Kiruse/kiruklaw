[package]
name = "kiruklaw-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
kiruklaw-agent-loop = { path = "../agent-loop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
tokio = { version = "1", features = ["macros", "rt"] }
trybuild = "1"
